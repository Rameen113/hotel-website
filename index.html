<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Errum Hotel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: whitesmoke;
      color: darkslategray;
    }

    /* HEADER */
    header {
      background: midnightblue;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: lightsteelblue;
      margin: 0 10px;
      text-decoration: none;
    }

    nav a:hover {
      color: white;
    }

    /* HERO SECTION */
    .hero {
      background: url('Naran.jpg') no-repeat center/cover;
      height: 85vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      top: 0;
      left: 0;
    }

    .hero-text {
      position: relative;
      color: white;
      max-width: 700px;
      padding: 20px;
    }

    .hero-text h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    .hero-text p {
      font-size: 1.2em;
      line-height: 1.6em;
    }

    /* BUTTON SECTION */
    .section {
      text-align: center;
      padding: 50px 20px;
    }

    button {
      background: darkslateblue;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1em;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: midnightblue;
    }

    /* FOOTER */
    footer {
      background: midnightblue;
      color: lightsteelblue;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h2>Errum Hotel</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="rooms.html">Rooms</a>
      <a href="attractions.html">Things To Do</a>
    </nav>
  </header>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-text">
      <h1>Welcome to Errum Hotel</h1>
      <p>
        A peaceful mountain stay in the heart of Naran surrounded by rivers, valleys, and breathtaking landscapes.
      </p>
    </div>
  </div>

  <!-- ROOMS BUTTON -->
  <div class="section">
    <h2>Explore Our Hotel</h2>

    <a href="rooms.html">
      <button>View Rooms</button>
    </a>

    <a href="attractions.html">
      <button>Things To Do</button>
    </a>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Errum Hotel | Naran Valley</p>
  </footer>

</body>
</html>
