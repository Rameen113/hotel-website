<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Errum Hotel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: whitesmoke;
      color: darkslategray;
    }

    /* HEADER */
    header {
      background: midnightblue;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: lightsteelblue;
      margin: 0 10px;
      text-decoration: none;
    }

    nav a:hover {
      color: white;
    }

    /* HERO */
    .hero {
      background: url('https://images.unsplash.com/photo-1601758003122-58d7e1f1c74b') no-repeat center/cover;
      height: 85vh;
    }

    /* SECTIONS */
    .section {
      padding: 50px 20px;
      text-align: center;
    }

    .section h2 {
      color: darkslateblue;
    }

    .section p {
      color: darkslategray;
    }

    /* ROOMS */
    .rooms {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .room {
      background: white;
      width: 250px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 10px lightgray;
    }

    .room img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .room h3 {
      margin: 10px 0;
      color: darkslategray;
    }

    .room p {
      color: gray;
    }

    /* BUTTON */
    button {
      background: darkslateblue;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-bottom: 15px;
      cursor: pointer;
    }

    button:hover {
      background: midnightblue;
    }

    /* FOOTER */
    footer {
      background: midnightblue;
      color: lightsteelblue;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <h2>Hotel Name</h2>
    <nav>
      <a href="#">Home</a>
      <a href="#">Rooms</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- HERO -->
  <div class="hero"></div>

  <!-- ABOUT -->
  <div class="section">
    <h2>Title</h2>
    <p>Write your hotel description here.</p>
  </div>

  <!-- ROOMS -->
  <div class="section">
    <h2>Rooms</h2>

    <div class="rooms">

      <div class="room">
        <img src="https://images.unsplash.com/photo-1505691938895-1758d7feb511">
        <h3>Room Name</h3>
        <p>Details here</p>
        <button>Button</button>
      </div>

      <div class="room">
        <img src="https://images.unsplash.com/photo-1560448204-e02f11c3d0e2">
        <h3>Room Name</h3>
        <p>Details here</p>
        <button>Button</button>
      </div>

      <div class="room">
        <img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b">
        <h3>Room Name</h3>
        <p>Details here</p>
        <button>Button</button>
      </div>

    </div>
  </div>

  <!-- CONTACT -->
  <div class="section">
    <h2>Contact</h2>
    <p>Write contact info here</p>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>Footer text here</p>
  </footer>

</body>
</html>
